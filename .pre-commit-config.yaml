repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-password-hashes
        name: No password hashes
        language: pygrep
        entry: '\$(?:6|y|5)\$[A-Za-z0-9./]{6,}\$?[A-Za-z0-9./]{20,}|grub\.pbkdf2\.sha\d+\.\d+\.[0-9A-Fa-f]{20,}'
        types: [text]

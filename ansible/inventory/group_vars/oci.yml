---
# Oracle's link-local NTP source.
baseline_chrony_servers:
  - 169.254.169.254

baseline_data_device: /dev/sdb
baseline_data_mountpoint: /srv

baseline_lvm_volumes:
  - {name: var, size: 18g}
  - {name: var_log, size: 8g}
  # Was 6g. Audit logs grow by about 170 MB a day and by about a gigabyte on a day of heavy work (2026-10-28: 705 MB,
  # 2026-10-30: 1.3 GB, 2026-11-11: 872 MB), and 90 days of that never fitted. At 6g the volume reached 86% on
  # 2026-11-13, and a full one drops the host to single-user mode (admin_space_left_action). 10g leaves 2.4 GB of the
  # volume group free.
  - {name: var_log_audit, size: 10g}

baseline_ssh_tailscale_only: true

# Rotated audit logs are kept 30 days, not 90 (about 5 to 6 GB of the 10g volume). Wazuh keeps the alerts that matched a
# rule, not every audit record, so the raw detail older than this is gone.
cis_audit_retention_days: 30

podman_host_service_users:
  - {name: keycloak, uid: 2001, subid_start: 200000}
  - {name: couchdb, uid: 2002, subid_start: 265536}
  - {name: runner, uid: 2003, subid_start: 331072}

edge_acme_staging: false

# git.jacklouallen.info is a public name that the tailnet also reaches on the private listener.
edge_extra_certs:
  - {name: git.jacklouallen.info, domains: [git.jacklouallen.info]}

# Keycloak's published loopback port (keycloak_published_port in the keycloak role).
edge_keycloak_upstream: 127.0.0.1:8180

# GitLab's public, read-only door (profile gitlab_readonly in the edge role). Empty keeps the public name a 503;
# setting it opens the door. GitLab's workhorse listens here (gitlab_workhorse_listen in the gitlab role).
edge_gitlab_upstream: 127.0.0.1:8181

# Private (tailnet) names. The dashboard speaks TLS on loopback with the Wazuh local CA, which
# nginx verifies.
edge_private_sites:
  - {host: edge.vaultnet.xyz, upstream: "", respond_text: edge ok, respond_status: 200}
  - {host: auth-admin.vaultnet.xyz, upstream: 127.0.0.1:8180, large_headers: true}
  - {host: auth.vaultnet.xyz, upstream: 127.0.0.1:8180, large_headers: true}
  # GitLab's private door: the same name as the public one, reached over the tailnet (see
  # docs/GITLAB_DESIGN.md). Pushes need large bodies and long timeouts.
  - host: git.jacklouallen.info
    upstream: 127.0.0.1:8181
    cert_name: git.jacklouallen.info
    large_headers: true
    max_body_size: 1g
    proxy_timeout: 300s
    no_request_buffering: true
    websockets: true
  - host: wazuh.vaultnet.xyz
    upstream: 127.0.0.1:5601
    upstream_scheme: https
    upstream_ca: /etc/wazuh-pki/root-ca.pem
    upstream_name: localhost

# systemd sandboxes for the Wazuh indexer and dashboard (the manager is not sandboxed).
wazuh_sandbox_units: true

# Backups to the Synology over SFTP on the tailnet. The password and the pinned NAS host key are
# in inventory/secrets/restic.sops.yml.
restic_sftp_host: rackstation
restic_sftp_user: backup
restic_repositories:
  - {name: nas, url: "sftp:nas-backup:/backups/oci1"}

# Wazuh agents (the Windows desktop and ovh1) report to the manager over the tailnet. The policy in
# tailscale/policy.hujson allows only the admin's own devices and tag:edge to reach it.
baseline_tailnet_ports:
  - 1514/tcp

# Health checks reported to hidden push monitors in Uptime Kuma on ovh1 (status_push role). Each name is both the name of
# a push monitor in Kuma and the key of its token in inventory/secrets/status-push.sops.yml. The disk limit is
# low enough to act on: a full /var stopped the Wazuh dashboard on 2026-11-11, with every service still "active".
status_push_monitors:
  - name: wazuh-stack
    tests:
      - {kind: systemd, unit: wazuh-indexer}
      - {kind: systemd, unit: wazuh-manager}
      - {kind: systemd, unit: wazuh-dashboard}
      - {kind: systemd, unit: filebeat}
      - {kind: tcp, host: 127.0.0.1, port: 9200}   # the indexer
      - {kind: tcp, host: 127.0.0.1, port: 55000}  # the manager's API, which the dashboard's Wazuh app calls
      - {kind: tcp, host: "{{ ansible_facts['tailscale0']['ipv4']['address'] | default('127.0.0.1') }}", port: 1514}  # agents
  - name: wazuh-dashboard
    tests:
      # Verified against the local CA, so an expired dashboard certificate (they last 730 days) shows as down
      - {kind: http, url: "https://localhost:5601/app/login", cafile: /etc/wazuh-pki/root-ca.pem}
  - name: oci1-disk
    tests:
      - {kind: disk, paths: [/, /var, /var/log, /var/log/audit, /srv], max_percent: 85}
  - name: keycloak
    tests:
      - {kind: http, url: "http://127.0.0.1:8180/realms/master"}
  - name: gitlab
    tests:
      - {kind: http, url: "http://127.0.0.1:8181/-/readiness"}

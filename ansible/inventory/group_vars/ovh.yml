---
# OVH's cloud-init created "rocky" with the key uploaded to the control panel, and the image's own
# default account "cloud-user" (locked, empty authorized_keys, but with a passwordless sudo rule in
# /etc/sudoers.d/90-cloud-init-users).
baseline_disable_cloud_init: true
baseline_remove_users: [rocky, cloud-user]

# The image's disk has a BIOS boot partition, /boot and an EFI partition ahead of the LVM partition:
# the physical volume is partition 4 here, not 3.
baseline_lvm_partition_number: 4
baseline_lvm_pv: /dev/sda4

# One 40 GB disk, no separate data volume: /srv is a logical volume. Sizes are final and lvol
# refuses to shrink, so they leave about 1 GB free in the volume group.
baseline_lvm_volumes:
  - {name: var, size: 8g}
  - {name: var_log, size: 4g}
  - {name: var_log_audit, size: 3g}
  - {name: srv, size: 8g}

# /var/log/audit is 3 GiB here (6 GiB on oci1), and a full audit volume puts the host in single-user mode
# (admin_space_left_action). Rotated logs are kept 30 days, not 90; Wazuh holds the history.
cis_audit_retention_days: 30

# SSH only over the tailnet (the role asserts the Tailscale interface exists).
baseline_ssh_tailscale_only: true

# Uptime Kuma runs here as a rootless service account (see the uptime_kuma role). The ID range follows the
# ones on oci1: each account gets the next block of 65536 after the last one used there.
podman_host_service_users:
  - {name: kuma, uid: 2004, subid_start: 396608}

# nginx (portfolio role) publishes Kuma's public status page by proxying to loopback port 8009.
uptime_kuma_published_port: 8009
portfolio_status_upstream: "127.0.0.1:{{ uptime_kuma_published_port }}"

# Kuma's admin interface, on the tailnet only, over a certificate Tailscale issues for this host's own name (see the
# portfolio role). SSH forwarding is off here (CIS 5.1.8), so the interface cannot be reached through a tunnel.
portfolio_admin_enabled: true

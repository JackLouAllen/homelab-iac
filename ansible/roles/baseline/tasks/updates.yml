---
- name: Install dnf-automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present
  register: baseline_dnf_automatic

- name: Configure automatic updates
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    mode: "0644"
    no_extra_spaces: true
  loop:
    - {section: commands, option: upgrade_type, value: "{{ baseline_dnf_upgrade_type }}"}
    - {section: commands, option: download_updates, value: "yes"}
    - {section: commands, option: apply_updates, value: "yes"}
    - {section: commands, option: reboot, value: "{{ baseline_dnf_reboot }}"}
    - {section: emitters, option: emit_via, value: stdio}

# In check mode the package is not installed yet, so its timer unit does not exist.
- name: Enable the update timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and baseline_dnf_automatic is changed)

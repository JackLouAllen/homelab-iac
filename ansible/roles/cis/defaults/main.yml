---
cis_admin_user: "{{ baseline_admin_user | default('JackL') }}"
cis_x86: "{{ ansible_facts.architecture == 'x86_64' }}"

cis_banner_text: Authorized users only. All activity may be monitored and reported.

cis_packages:
  - aide
  - authselect
  - cronie
  - sequoia-sq
  - systemd-journal-remote

# Supplied at run time from a tmpfs copy of inventory/secrets/cis.sops.yml.
cis_root_password_hash: ""
cis_grub_pbkdf2_hash: ""

# SSH
cis_ssh_allow_users:
  - "{{ cis_admin_user }}"
cis_ssh_client_alive_interval: 300
cis_ssh_client_alive_count_max: 1

# Accounts
cis_password_max_days: 365
cis_password_min_days: 1
cis_password_inactive_days: 45
cis_umask: "027"
cis_tmout: 900
cis_su_group: sugroup

# PAM
cis_manage_pam: true
cis_authselect_features:
  - with-faillock
  - with-pwhistory
  - without-nullok
cis_faillock_deny: 5
cis_faillock_interval: 900
cis_faillock_unlock_time: 900
cis_faillock_root_unlock_time: 60
cis_pwhistory_remember: 24

# sudo
cis_sudo_logfile: /var/log/sudo.log
cis_sudo_timestamp_timeout: 15

# auditd.conf
cis_auditd_space_left_action: email
cis_auditd_admin_space_left_action: single
cis_auditd_max_log_file_action: keep_logs
cis_auditd_disk_full_action: single
cis_auditd_disk_error_action: syslog
# keep_logs never deletes rotated logs, so a timer prunes them to stop the audit volume
# filling, which would put the host in single-user mode. Wazuh must ship logs well before this.
cis_audit_retention_days: 90
# -e 2 locks the rules until reboot, so enable it only at the end of a hardening pass.
cis_audit_immutable: false

# Logging: journald only, as the benchmark requires exactly one active logger.
cis_disable_rsyslog: true

# Podman bridge networks and Tailscale subnet routing need forwarding.
cis_allow_ip_forwarding: false

# overlay is left out on purpose: Podman needs the overlay storage driver.
cis_blacklisted_modules:
  - atm
  - can
  - cramfs
  - dccp
  - firewire-core
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - rds
  - sctp
  - squashfs
  - tipc
  - udf
  - usb-storage

# /var/tmp stays exec: rpm runs package scriptlets from there.
cis_mount_options:
  /tmp: [nodev, nosuid, noexec]
  /var/tmp: [nodev, nosuid]
  /dev/shm: [nodev, nosuid, noexec]
  /home: [nodev, nosuid]
  /var: [nodev, nosuid]
  /var/log: [nodev, nosuid, noexec]
  /var/log/audit: [nodev, nosuid, noexec]

cis_masked_units:
  - bluetooth.service
  - nfs-server.service
  - rpcbind.service
  - rpcbind.socket

cis_aide_audit_tools:
  - /usr/sbin/auditctl
  - /usr/sbin/auditd
  - /usr/sbin/augenrules
  - /usr/sbin/aureport
  - /usr/sbin/ausearch
  - /usr/sbin/autrace
cis_aide_check_time: "0 5 * * *"

cis_crypto_policy: DEFAULT:NO-SSHCBC:NO-SSHWEAKCIPHERS:NO-SSHWEAKMACS:NO-WEAKMAC

cis_sysctl_base:
  kernel.randomize_va_space: 2
  kernel.yama.ptrace_scope: 1
  kernel.dmesg_restrict: 1
  fs.suid_dumpable: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv6.conf.all.accept_ra: 0
  net.ipv6.conf.default.accept_ra: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
cis_sysctl_no_forwarding:
  net.ipv4.ip_forward: 0
  net.ipv4.conf.all.forwarding: 0
  net.ipv4.conf.default.forwarding: 0
  net.ipv6.conf.all.forwarding: 0
  net.ipv6.conf.default.forwarding: 0

# The benchmark checks both architectures, even on 64-bit-only hosts.
cis_audit_arches: [b32, b64]
cis_audit_paths:
  - {kind: path, path: /etc/sudoers, key: actions}
  - {kind: dir, path: /etc/sudoers.d/, key: actions}
  - {kind: path, path: /var/log/sudo.log, key: maintenance}
  - {kind: path, path: /etc/localtime, key: audit_time_rules}
  - {kind: path, path: /etc/issue, key: system-locale}
  - {kind: path, path: /etc/issue.net, key: system-locale}
  - {kind: path, path: /etc/hosts, key: system-locale}
  - {kind: path, path: /etc/hostname, key: system-locale}
  - {kind: path, path: /etc/sysconfig/network, key: system-locale}
  - {kind: path, path: /etc/NetworkManager, key: system-locale}
  - {kind: dir, path: /etc/NetworkManager/system-connections/, key: system-locale}
  - {kind: dir, path: /etc/selinux/, key: MAC-policy}
  - {kind: dir, path: /usr/share/selinux/, key: MAC-policy}
  - {kind: path, path: /var/log/lastlog, key: logins}
  - {kind: path, path: /var/run/faillock, key: logins}
  - {kind: path, path: /var/run/utmp, key: session}
  - {kind: path, path: /var/log/wtmp, key: session}
  - {kind: path, path: /var/log/btmp, key: session}
  - {kind: path, path: /etc/group, key: audit_rules_usergroup_modification}
  - {kind: path, path: /etc/passwd, key: audit_rules_usergroup_modification}
  - {kind: path, path: /etc/gshadow, key: audit_rules_usergroup_modification}
  - {kind: path, path: /etc/shadow, key: audit_rules_usergroup_modification}
  - {kind: path, path: /etc/security/opasswd, key: audit_rules_usergroup_modification}
  - {kind: path, path: /etc/nsswitch.conf, key: audit_rules_usergroup_modification}
  - {kind: path, path: /etc/pam.conf, key: audit_rules_usergroup_modification}
  - {kind: dir, path: /etc/pam.d/, key: audit_rules_usergroup_modification}
# One rule per syscall and architecture; x86_only entries do not exist on aarch64.
cis_audit_auid: "-F auid>=1000 -F auid!=unset"
cis_audit_syscalls:
  - {name: fchmod, key: perm_mod}
  - {name: fchmodat, key: perm_mod}
  - {name: fchmodat2, key: perm_mod}
  - {name: chmod, key: perm_mod, x86_only: true}
  - {name: fchown, key: perm_mod}
  - {name: fchownat, key: perm_mod}
  - {name: chown, key: perm_mod, x86_only: true}
  - {name: lchown, key: perm_mod, x86_only: true}
  - {name: setxattr, key: perm_mod, auid0: true}
  - {name: lsetxattr, key: perm_mod, auid0: true}
  - {name: fsetxattr, key: perm_mod, auid0: true}
  - {name: removexattr, key: perm_mod, auid0: true}
  - {name: lremovexattr, key: perm_mod, auid0: true}
  - {name: fremovexattr, key: perm_mod, auid0: true}
  - {name: openat, key: access, exits: [-EACCES, -EPERM]}
  - {name: truncate, key: access, exits: [-EACCES, -EPERM]}
  - {name: ftruncate, key: access, exits: [-EACCES, -EPERM]}
  - {name: open, key: access, exits: [-EACCES, -EPERM], x86_only: true}
  - {name: creat, key: access, exits: [-EACCES, -EPERM], x86_only: true}
  - {name: unlinkat, key: delete}
  - {name: renameat, key: delete}
  - {name: renameat2, key: delete}
  - {name: unlink, key: delete, x86_only: true}
  - {name: rename, key: delete, x86_only: true}
  - {name: mount, key: export}
  - {name: init_module, key: modules}
  - {name: finit_module, key: modules}
  - {name: delete_module, key: modules}
  - {name: sethostname, key: system-locale}
  - {name: setdomainname, key: system-locale}
  - {name: adjtimex, key: audit_time_rules, no_auid: true}
  - {name: settimeofday, key: audit_time_rules, no_auid: true}
  - {name: clock_settime, key: time-change, extra: "-F a0=0x0", no_auid: true}
cis_audit_exec_paths:
  - /usr/sbin/usermod
  - /usr/bin/kmod
  - /usr/bin/chacl
  - /usr/bin/chcon
  - /usr/bin/setfacl

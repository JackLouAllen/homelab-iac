---
- name: Reload sshd (cis)
  ansible.builtin.service:
    name: sshd
    state: reloaded

- name: Reload systemd (cis)
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart postfix
  ansible.builtin.service:
    name: postfix
    state: restarted

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

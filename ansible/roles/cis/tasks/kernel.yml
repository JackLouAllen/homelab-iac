---
- name: Disable unused kernel modules
  ansible.builtin.copy:
    content: |
      {% for module in cis_blacklisted_modules %}
      install {{ module }} /bin/false
      blacklist {{ module }}
      {% endfor %}
    dest: /etc/modprobe.d/cis.conf
    owner: root
    group: root
    mode: "0644"

- name: Set kernel and network sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-cis.conf
    sysctl_set: true
    reload: false
    state: present
  loop: "{{ (cis_sysctl_base | combine({} if cis_allow_ip_forwarding else cis_sysctl_no_forwarding)) | dict2items }}"

- name: Create the core dump drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable core dump storage
  ansible.builtin.copy:
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    dest: /etc/systemd/coredump.conf.d/cis.conf
    owner: root
    group: root
    mode: "0644"

- name: Disable core dumps for users
  ansible.builtin.copy:
    content: |
      * hard core 0
    dest: /etc/security/limits.d/60-cis-core.conf
    owner: root
    group: root
    mode: "0644"

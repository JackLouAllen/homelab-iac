---
- name: Reload systemd for edge
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: reloaded

- name: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    state: restarted

- name: Restart cloudflared
  ansible.builtin.systemd_service:
    name: cloudflared.service
    state: restarted

---
- name: Create the cloudflared account
  ansible.builtin.user:
    name: cloudflared
    system: true
    shell: /sbin/nologin
    create_home: false
    password_lock: true

- name: Create the cloudflared configuration directory
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Look for an existing tunnel token
  ansible.builtin.stat:
    path: /etc/cloudflared/tunnel-token
  register: edge_tunnel_token_file

- name: Check the tunnel token is available
  ansible.builtin.assert:
    that: (edge_tunnel_token | length > 0) or edge_tunnel_token_file.stat.exists
    fail_msg: >-
      Pass edge_tunnel_token with -e @file from a tmpfs copy of
      inventory/secrets/edge.sops.yml.

- name: Store the tunnel token
  ansible.builtin.copy:
    content: "{{ edge_tunnel_token }}\n"
    dest: /etc/cloudflared/tunnel-token
    owner: root
    group: root
    mode: "0600"
  when: edge_tunnel_token | length > 0
  no_log: true
  notify: Restart cloudflared

- name: Install the cloudflared unit
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for edge
    - Restart cloudflared

- name: Flush handlers before starting cloudflared
  ansible.builtin.meta: flush_handlers

- name: Enable cloudflared
  ansible.builtin.systemd_service:
    name: cloudflared.service
    enabled: true
    state: started

---
# httpd_t needs this to proxy to the loopback ports of rootless containers.
- name: Allow nginx to connect to upstream services
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

- name: Create the nginx service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# The private listener binds the tailnet address, which exists only once tailscaled is up.
- name: Wait for the tailnet address before starting nginx
  ansible.builtin.template:
    src: nginx-tailscale.conf.j2
    dest: /etc/systemd/system/nginx.service.d/tailscale.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for edge

- name: Sandbox the nginx service
  ansible.builtin.template:
    src: nginx-hardening.conf.j2
    dest: /etc/systemd/system/nginx.service.d/hardening.conf
    owner: root
    group: root
    mode: "0644"
  when: edge_sandbox_units
  notify:
    - Reload systemd for edge
    - Restart nginx

- name: Remove the nginx sandbox when it is switched off
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d/hardening.conf
    state: absent
  when: not edge_sandbox_units
  notify:
    - Reload systemd for edge
    - Restart nginx

- name: Install the security headers
  ansible.builtin.template:
    src: security-headers.conf.j2
    dest: /etc/nginx/security-headers.conf
    owner: root
    group: root
    mode: "0644"

- name: Install the nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    validate: nginx -t -c %s
  notify: Reload nginx

- name: Flush handlers before starting nginx
  ansible.builtin.meta: flush_handlers

- name: Enable nginx
  ansible.builtin.systemd_service:
    name: nginx.service
    enabled: true
    state: started

- name: Check for the staging certificate lineage
  ansible.builtin.stat:
    path: /etc/letsencrypt/renewal/{{ edge_private_zone }}-staging.conf
  register: edge_staging_lineage

- name: Remove the staging certificate once production is in use
  ansible.builtin.command: certbot delete --cert-name {{ edge_private_zone }}-staging --non-interactive
  when: not edge_acme_staging and edge_staging_lineage.stat.exists
  changed_when: true

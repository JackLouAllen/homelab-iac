---
# diff: false, because the file holds the single sign-on secret and --diff would print it.
- name: Write the GitLab configuration
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
  notify: Reconfigure GitLab
  diff: false

- name: Create the memory limit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/gitlab-runsvdir.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Limit GitLab's memory
  ansible.builtin.template:
    src: memory.conf.j2
    dest: /etc/systemd/system/gitlab-runsvdir.service.d/memory.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for gitlab

- name: Apply the configuration now
  ansible.builtin.meta: flush_handlers

# In check mode the package is not installed, so the service does not exist yet.
- name: Enable GitLab at boot
  ansible.builtin.systemd_service:
    name: gitlab-runsvdir.service
    enabled: true
    state: started
  when: not ansible_check_mode

# The first start creates the database and takes several minutes.
- name: Wait for GitLab to answer on loopback
  ansible.builtin.uri:
    url: http://{{ gitlab_workhorse_listen }}/-/readiness
    status_code: 200
  register: gitlab_ready
  until: gitlab_ready.status == 200
  retries: 60
  delay: 10
  when: not ansible_check_mode

# The sign-in goes browser, then Keycloak on its private name, then GitLab calls Keycloak itself to trade the
# code for a token. This is that second call's path (name resolution, certificate, nginx, Keycloak), checked
# from the host before anyone hits it.
- name: Check GitLab can reach Keycloak's discovery document
  ansible.builtin.uri:
    url: "{{ gitlab_oidc_issuer }}/.well-known/openid-configuration"
    return_content: true
  register: gitlab_oidc_discovery
  failed_when: gitlab_oidc_discovery.json.issuer | default('') != gitlab_oidc_issuer
  when: gitlab_oidc_enabled and not ansible_check_mode

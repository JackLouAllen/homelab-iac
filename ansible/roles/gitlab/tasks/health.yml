---
- name: Install the readiness check and its timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - gitlab-health.service
    - gitlab-health.timer
  notify: Reload systemd for gitlab

- name: Apply the unit files now
  ansible.builtin.meta: flush_handlers

- name: Enable the readiness timer
  ansible.builtin.systemd_service:
    name: gitlab-health.timer
    enabled: true
    state: started
  when: not ansible_check_mode

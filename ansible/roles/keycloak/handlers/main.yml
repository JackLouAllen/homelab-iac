---
- name: Reload the keycloak user's systemd
  ansible.builtin.command: >-
    {{ keycloak_as_user }}
    systemctl --user daemon-reload
  args:
    chdir: /
  changed_when: true

- name: Restart the Keycloak pod
  ansible.builtin.command: >-
    {{ keycloak_as_user }}
    systemctl --user restart keycloak-db.service keycloak.service
  args:
    chdir: /
  changed_when: true

---
- name: Check the secrets were supplied
  ansible.builtin.assert:
    that:
      - keycloak_db_password | length >= 24
    fail_msg: >-
      Pass keycloak_db_password (24+ characters) from a tmpfs copy of
      inventory/secrets/keycloak.sops.yml with -e @file.
    quiet: true
  no_log: true

# Facts the rest of the role relies on: the account and its user systemd instance exist.
- name: Check the service account exists and lingers
  ansible.builtin.stat:
    path: /var/lib/systemd/linger/{{ keycloak_user }}
  register: keycloak_linger
  failed_when: not keycloak_linger.stat.exists

- name: Create the data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ keycloak_user }}"
    group: "{{ keycloak_user }}"
    mode: "0700"
  loop:
    - "{{ keycloak_home }}/volumes"
    - "{{ keycloak_home }}/volumes/postgres"

# The database image comes from a registry that needs a login, so it is pulled by hand once.
- name: Check the database image is in the keycloak user's storage
  ansible.builtin.command: >-
    {{ keycloak_as_user }}
    podman image exists {{ keycloak_db_image }}
  args:
    chdir: /
  register: keycloak_db_image_present
  changed_when: false
  failed_when: keycloak_db_image_present.rc not in [0, 1]
  check_mode: false

- name: Stop if the database image has not been pulled
  ansible.builtin.fail:
    msg: >-
      {{ keycloak_db_image }} is not in the keycloak user's storage. As that user: podman login
      registry.redhat.io, podman pull the image, podman logout. Then re-run.
  when: keycloak_db_image_present.rc == 1

# The secret is created once from stdin. Podman has no update: to rotate, remove the secret
# (podman secret rm), re-run, and the pod restart picks it up. The Red Hat PostgreSQL image applies
# POSTGRESQL_PASSWORD with ALTER ROLE on every start (set_passwords.sh), so the database follows.
- name: Check whether the database password secret exists
  ansible.builtin.command: >-
    {{ keycloak_as_user }}
    podman secret exists keycloak-db-password
  args:
    chdir: /
  register: keycloak_secret_present
  changed_when: false
  failed_when: keycloak_secret_present.rc not in [0, 1]
  check_mode: false

- name: Create the database password secret
  ansible.builtin.command: >-
    {{ keycloak_as_user }}
    podman secret create keycloak-db-password -
  args:
    chdir: /
    stdin: "{{ keycloak_db_password }}"
    stdin_add_newline: false
  when: keycloak_secret_present.rc != 0
  changed_when: true
  no_log: true

- name: Install the Quadlet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ keycloak_home }}/.config/containers/systemd/{{ item }}"
    owner: "{{ keycloak_user }}"
    group: "{{ keycloak_user }}"
    mode: "0644"
  loop:
    - keycloak.pod
    - keycloak-db.container
    - keycloak.container
  notify:
    - Reload the keycloak user's systemd
    - Restart the Keycloak pod

- name: Flush handlers before starting the units
  ansible.builtin.meta: flush_handlers

# The bootstrap admin only exists to create the first real admin. Once the unit stops referencing
# its password, the secret is dead weight: remove it (nothing to do on a fresh host).
- name: Check for the retired bootstrap admin secret
  ansible.builtin.command: >-
    {{ keycloak_as_user }}
    podman secret exists keycloak-bootstrap-admin-password
  args:
    chdir: /
  register: keycloak_old_secret
  changed_when: false
  failed_when: keycloak_old_secret.rc not in [0, 1]
  check_mode: false

- name: Remove the retired bootstrap admin secret
  ansible.builtin.command: >-
    {{ keycloak_as_user }}
    podman secret rm keycloak-bootstrap-admin-password
  args:
    chdir: /
  when: keycloak_old_secret.rc == 0
  changed_when: true

# Quadlet generates the services; the [Install] sections enable them at generation time.
- name: Start the database and Keycloak
  ansible.builtin.command: >-
    {{ keycloak_as_user }}
    systemctl --user start keycloak-db.service keycloak.service
  args:
    chdir: /
  changed_when: false
  when: not ansible_check_mode

# First start builds Keycloak and creates the schema: allow several minutes.
- name: Wait for Keycloak on loopback
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ keycloak_published_port }}/realms/master
    status_code: 200
  register: keycloak_up
  until: keycloak_up.status == 200
  retries: 40
  delay: 10
  when: not ansible_check_mode

- name: Backups
  ansible.builtin.import_tasks: backup.yml
  tags: [keycloak_backup]

---
# The public site on ovh1: nginx on loopback, reached only through a Cloudflare Tunnel (no inbound port).
portfolio_zone: jacklouallen.info
portfolio_port: 8008
portfolio_root: /var/www/portfolio

# Names answered by this host. The apex serves the site, www redirects to it, status is a placeholder
# (503) until Uptime Kuma exists. Anything else gets 404.
portfolio_status_name: "status.{{ portfolio_zone }}"

# Sandbox the units (systemd-analyze security); false only to debug.
portfolio_sandbox_units: true

# Supplied at run time from a tmpfs copy of inventory/secrets/portfolio.sops.yml.
portfolio_tunnel_token: ""

# The signing key is pinned by fingerprint before it is imported.
portfolio_cloudflare_key_url: https://pkg.cloudflare.com/cloudflare-ascii-pubkey.gpg
portfolio_cloudflare_key_fingerprint: CC94B39C77AE7342A68B89628A682D308D4E5E73  # gitleaks:allow (public signing-key fingerprint)

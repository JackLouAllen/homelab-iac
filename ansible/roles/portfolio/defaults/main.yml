---
# The public site on ovh1: nginx on loopback, reached only through a Cloudflare Tunnel (no inbound port).
portfolio_zone: jacklouallen.info
portfolio_port: 8008
portfolio_root: /var/www/portfolio

# Names answered by this host. The apex serves the site, www redirects to it, status is a placeholder
# (503) until Uptime Kuma exists. Anything else gets 404.
portfolio_status_name: "status.{{ portfolio_zone }}"

# Where Uptime Kuma listens on this host. Empty keeps the placeholder; set it and the status name proxies the
# public pages of Kuma (and nothing else of it) to this address.
portfolio_status_upstream: ""

# Uptime Kuma's admin interface on the tailnet only: nginx listens on this host's Tailscale address and serves the
# whole of Kuma there (login, dashboard, WebSocket) under the host's own MagicDNS name, with a certificate Tailscale
# issues for that name. No DNS record and no DNS token are involved. It needs "HTTPS Certificates" switched on once in
# the Tailscale admin console (DNS page), and portfolio_status_upstream to be set.
portfolio_admin_enabled: false
portfolio_tailnet_ip: "{{ ansible_facts['tailscale0']['ipv4']['address'] | default('') }}"
# Read from "tailscale status" at run time (this host's name, ending .ts.net), so the tailnet's name is not kept in Git.
portfolio_admin_domain: ""
portfolio_admin_cert_file: "/etc/pki/tls/certs/{{ portfolio_admin_domain }}.crt"
portfolio_admin_key_file: "/etc/pki/tls/private/{{ portfolio_admin_domain }}.key"
# Tailscale's certificates last 90 days and "tailscale cert" renews them when they are near the end.
portfolio_admin_renew_calendar: weekly

# Sandbox the units (systemd-analyze security); false only to debug.
portfolio_sandbox_units: true

# Supplied at run time from a tmpfs copy of inventory/secrets/portfolio.sops.yml.
portfolio_tunnel_token: ""

# The signing key is pinned by fingerprint before it is imported.
portfolio_cloudflare_key_url: https://pkg.cloudflare.com/cloudflare-ascii-pubkey.gpg
portfolio_cloudflare_key_fingerprint: CC94B39C77AE7342A68B89628A682D308D4E5E73  # gitleaks:allow (public signing-key fingerprint)

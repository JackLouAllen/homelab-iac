---
- name: Reload systemd for runner
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload the runner's user systemd
  ansible.builtin.command: >-
    {{ runner_as_user }}
    systemctl --user daemon-reload
  args:
    chdir: /
  changed_when: true
  when: not ansible_check_mode

- name: Restart the runner
  ansible.builtin.command: >-
    {{ runner_as_user }}
    systemctl --user restart gitlab-runner.service
  args:
    chdir: /
  changed_when: true
  when: not ansible_check_mode and runner_token | length > 0

- name: Reload the runner's network rules
  ansible.builtin.systemd_service:
    name: runner-egress.service
    state: restarted
  when: not ansible_check_mode

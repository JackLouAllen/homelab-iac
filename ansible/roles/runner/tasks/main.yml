---
- name: Check the network rules have an address to allow
  ansible.builtin.assert:
    that: runner_gitlab_address | length > 0
    fail_msg: tailscale0 has no address; join the tailnet first (the runner's jobs may reach only the private door).
    quiet: true

- name: Check the token has the right shape when one is given
  ansible.builtin.assert:
    that: runner_token | length == 0 or (runner_token is match('^glrt-[A-Za-z0-9_.-]{20,}$'))
    fail_msg: runner_token must be a runner authentication token (glrt-...) or empty.
    quiet: true
  no_log: true

# Facts the rest of the role relies on: the account and its user systemd instance exist.
- name: Check the service account exists and lingers
  ansible.builtin.stat:
    path: /var/lib/systemd/linger/{{ runner_user }}
  register: runner_linger
  failed_when: not runner_linger.stat.exists

# The runner talks to GitLab through the private door. On this host the name must resolve to the tailnet address;
# otherwise it resolves to Cloudflare and the runner meets the public read-only door, which refuses every POST
# (405 on each job request). Jobs get the same mapping through extra_hosts in config.toml.
- name: Make GitLab's name resolve to the private door on this host
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED: CI runner reaches GitLab's private door"
    block: "{{ runner_gitlab_address }} {{ runner_gitlab_name }}"
  notify: Restart the runner

- name: Network rules and resource limits
  ansible.builtin.import_tasks: isolation.yml
  tags: [runner_isolation]

- name: Package
  ansible.builtin.import_tasks: packages.yml
  tags: [runner_packages]

- name: Service
  ansible.builtin.import_tasks: service.yml
  tags: [runner_service]

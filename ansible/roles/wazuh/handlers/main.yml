---
- name: Reload systemd for wazuh
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart the indexer
  ansible.builtin.systemd_service:
    name: wazuh-indexer.service
    state: restarted

- name: Restart filebeat
  ansible.builtin.systemd_service:
    name: filebeat.service
    state: restarted

- name: Restart the manager
  ansible.builtin.systemd_service:
    name: wazuh-manager.service
    state: restarted

- name: Reload auditd
  ansible.builtin.systemd_service:
    name: auditd.service
    state: reloaded

- name: Restart the dashboard
  ansible.builtin.systemd_service:
    name: wazuh-dashboard.service
    state: restarted

# systemctl refuses to restart auditd on purpose; the service wrapper is the supported way. It
# reloads the audit rules from disk.
- name: Restart auditd
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: true

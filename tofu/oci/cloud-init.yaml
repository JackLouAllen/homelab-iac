#cloud-config
# The image already has the admin user and the break-glass key.
# Don't let cloud-init add a cloud-user account; hostname is Ansible's job.
users: []
disable_root: true
ssh_pwauth: false
preserve_hostname: true

# disable_root only locks root's authorized_keys; sshd still defaults to without-password.
write_files:
  - path: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root:root
    permissions: "0600"
    content: |
      PermitRootLogin no
